[package]
name = "skyplug"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Scan and toggle Skyrim Special Edition plugins (Plugins.txt) on Linux/Steam"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = "0.30.2"
crossterm = "0.29.0"
lz4_flex = "0.11"

[profile.release]
opt-level = 3
